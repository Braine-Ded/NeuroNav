<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maps</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
    integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
</head>

<body>
  <div class="search">
    <i class="fa-solid fa-magnifying-glass"></i>
    <input type="text" class="search-box" placeholder="Search Places (eg. Cafe, Library)">
  </div>

  <div id="map"></div>

  <div id="navbar">

    <div class="nav-elem">
      <button id="btn">
        <i class="fa-solid fa-location-crosshairs"></i>
        <p>Location</p>
      </button>
    </div>

    <div class="nav-elem">
      <button id="btn" class="active-tag contribute">
        <i class="fa-solid fa-circle-plus active"></i>
        <p>Contribute</p>
      </button>
    </div>

    <div class="nav-elem">
      <button id="btn">
        <i class="fa-solid fa-filter"></i>
        <p>Filter</p>
      </button>
    </div>
  </div>

  <div id="formBox">
    <div class="form-content">
    <h3>Add Report</h3>

    <input type="text" id="placename" placeholder="Place name">
    <select id="noise">
      <option value="quiet">Quiet</option>
      <option value="light">Light Noise</option>
      <option value="loud">Loud</option>
    </select>
    <button onclick="submitForm()" id="submit-btn">Submit</button>
    </div>
  </div>

  <script src="api.js"></script>
  <script src="map.js"></script>
  <script src="app.js"></script>
</body>

</html>
